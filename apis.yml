name: Luxvisions Innovation Limited
description: 'Luxvisions Innovation Limited is a camera module and imaging technology manufacturer
  established in March 2018, headquartered in Hong Kong with operations in Guangzhou, Shenzhen and
  Shangrao, China. The company designs and produces optical camera modules and audio-video integration
  technology for mobile phones, tablets, PCs and notebooks, automotive systems, AIOT devices, and
  3D/ToF VR/AR/MR applications, and states it launched the industry''s first triple camera module for
  mobile phones. It was surfaced as a portfolio company of Hongshan (HongShan Capital) and added to the
  API Evangelist network. As a hardware/component manufacturer, Luxvisions publishes no public developer
  portal, API, SDK, or documentation surface at this time.'
